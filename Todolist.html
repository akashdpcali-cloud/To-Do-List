<!DOCTYPE html>
<html>
  <head>
    <title>To Do List</title>
    <link rel="stylesheet" href="Todolist.css">
  </head>

  <body>
    <header class="header">
      <div class="left-section">
        <img class="profile-image" src="profile-image.jpeg" alt="Not available">
        <div class="username">Username</div>
      </div>
      <div class="right-section" id="logout">Logout</div>
    </header>
    <p class="title">TO DO LIST</p>
    <div class="input-div">
      <input class="inputBar place" type="text" placeholder="Enter your task">
      <input class="inputDate place" type="date">
      <button class="createButton">Create</button>
      <button class="removeallbutton">Remove All</button>
    </div>
    
    <div class="display-div"></div>

    <script type="module" src="Todolist.js"></script>
  </body>
</html>
